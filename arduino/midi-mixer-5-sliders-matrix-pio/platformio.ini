; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Arduino Pro Micro (ATmega32u4, 5V/16MHz) as a USB-MIDI controller for MIDI Mixer.
; For clones that refuse to flash as sparkfun_promicro16, try board = leonardo or board = micro.
[env:promicro]
platform = atmelavr
board = sparkfun_promicro16
framework = arduino
monitor_speed = 115200
; USB/MIDI device name; must match "input"/"output" in midi-mixer-profile/spec.json
board_build.usb_product = "MAX7219 Mixer"
lib_deps =
    majicdesigns/MD_MAX72XX@^3.5.1
    arduino-libraries/MIDIUSB@^1.0.5
