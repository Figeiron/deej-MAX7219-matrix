name: deej-matrix

# Builds on every push to the branch; a tag like deej-matrix/v1.2.0 also publishes a GitHub release
on:
  push:
    branches: [deej-matrix]
    tags: ["deej-matrix/v*"]
  pull_request:
    branches: [deej-matrix]

jobs:
  firmware:
    name: Firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        working-directory: arduino/deej-5-sliders-matrix-pio
        run: pio run

      - name: Package
        run: |
          mkdir -p dist
          cp arduino/deej-5-sliders-matrix-pio/.pio/build/nanoatmega328new/firmware.hex dist/deej-matrix-firmware.hex

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/

  app:
    name: deej app (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build script embeds `git describe --tags`

      # The bundled rsrc_windows.syso doesn't link with newer Go toolchains
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Build
        shell: cmd
        run: pkg\deej\scripts\windows\build-release.bat

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item deej-release.exe dist/deej.exe
          Copy-Item config.yaml dist/config.yaml

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: dist/

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/deej-matrix/v')
    needs: [firmware, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#deej-matrix/v}"
          awk -v v="$version" '/^## \[/ { p = index($0, "[" v "]") > 0; next } p' CHANGELOG.md > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
