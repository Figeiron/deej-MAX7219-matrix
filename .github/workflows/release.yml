name: deej-vanilla

# Builds on every push to the branch; a tag like deej-vanilla/v1.2.0 also publishes a GitHub release
on:
  push:
    branches: [deej-vanilla]
    tags: ["deej-vanilla/v*"]
  pull_request:
    branches: [deej-vanilla]

jobs:
  firmware:
    name: Firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Build firmware
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          # Pro Micro is Leonardo-compatible (ATmega32u4)
          arduino-cli compile --fqbn arduino:avr:leonardo --output-dir build arduino/deej-5-sliders-vanilla

      - name: Package
        run: |
          mkdir -p dist
          cp build/deej-5-sliders-vanilla.ino.hex dist/deej-vanilla-firmware.hex
          cp arduino/deej-5-sliders-vanilla/deej-5-sliders-vanilla.ino dist/

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/

  app:
    name: deej app (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build script embeds `git describe --tags`

      # The bundled rsrc_windows.syso doesn't link with newer Go toolchains
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Build
        shell: cmd
        run: pkg\deej\scripts\windows\build-release.bat

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item deej-release.exe dist/deej.exe
          Copy-Item config.yaml dist/config.yaml

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: dist/

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/deej-vanilla/v')
    needs: [firmware, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#deej-vanilla/v}"
          awk -v v="$version" '/^## \[/ { p = index($0, "[" v "]") > 0; next } p' CHANGELOG.md > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
